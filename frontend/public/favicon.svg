<svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eyeGrad" x1="10" y1="50" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="50%" stopColor="#0284C7"/>
      <stop offset="100%" stopColor="#2563EB"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="50" cy="50" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284C7"/>
      <stop offset="50%" stopColor="#0369A1"/>
      <stop offset="100%" stopColor="#0C4A6E"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="18" y1="50" x2="82" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stopColor="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stopColor="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Eye Contour -->
  <path d="M8 50C18 24 40 16 50 16C60 16 82 24 92 50" stroke="url(#eyeGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M8 50C18 76 40 84 50 84C60 84 82 76 92 50" stroke="url(#eyeGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Retinal Iris -->
  <circle cx="50" cy="50" r="25" fill="url(#irisGrad)" stroke="#0284C7" stroke-width="2"/>
  <circle cx="50" cy="50" r="18" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="50" cy="50" r="8" fill="#07111F" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="47.5" cy="47.5" r="2" fill="#FFFFFF"/>

  <!-- Scanning Laser Beam -->
  <line x1="18" y1="50" x2="82" y2="50" stroke="url(#scanGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="2.5" fill="#38BDF8"/>
  <circle cx="50" cy="24" r="2.5" fill="#38BDF8"/>
  <circle cx="75" cy="50" r="2.5" fill="#2DD4BF"/>
</svg>